name: Validate and deploy DevLab
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/commerce-mini/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/commerce-mini
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:mini
      - run: npm run build:app
      - run: npx playwright install --with-deps chromium
      - name: Install Chinese fonts for browser evidence
        run: sudo apt-get install -y fonts-noto-cjk
      - run: npm run test:e2e
      - run: npm run test:summary
        if: always()
      - run: npm run security:scan -- --report docs/testing/security-scan.json
      - name: Build repository-path deployment
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Validate final Pages paths and business interactions
        run: node scripts/check-built-path.mjs
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - run: npm run security:scan -- --report docs/testing/security-scan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          # Explicit PNG-only ORBIT diagnostics; traces, videos and storage stay excluded.
          include-hidden-files: true
          path: |
            docs/testing/
            docs/screenshots/
            .local/e2e/results/orbit-*/*.png
            .local/e2e/results/dominion-*/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: wechat-mini-build
          path: apps/commerce-mini/dist/build/mp-weixin/
      - uses: actions/upload-artifact@v4
        with:
          name: app-resources-not-installable
          path: apps/commerce-mini/dist/build/app/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
